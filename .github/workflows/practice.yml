name: C# practice checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: List problem suites
        run: dotnet run --configuration Release --no-build -- --list
      - name: Run every problem suite
        run: dotnet run --configuration Release --no-build
